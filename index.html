<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카트부터 월챔까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, cards stacked, bottom tab bar — paddock timing-screen numerals on a Toss-style dark app */
:root{
  --bg:#0E0F12; --surface:#1B1D22; --surface-2:#25282F; --line:#30333B;
  --fg:#F2F3F6; --muted:#8D929D; --dim:#5E636E;
  --accent:#3182F6; --accent-soft:#1B2E4D; --good:#34C77B; --bad:#F04452; --gold:#F2C14E;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --num:"Barlow Condensed","IBM Plex Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:20px 110px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.02em}
.iconbtn{background:var(--surface-2);border:0;border-radius:12px;padding:8px 14px;color:var(--muted);font-size:14px}
.card{background:var(--surface);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{color:var(--muted);font-size:14px}
.h2{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance;line-height:1.3}
.h3{font-size:18px;font-weight:700;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn{background:var(--accent);color:#fff;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:700;width:100%}
.btn:disabled{background:var(--accent-soft);color:#6A84AD;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.row > *{min-width:0}
.kv{display:flex;flex-direction:column;gap:12px}
.kv .row > span:first-child{color:var(--muted)}
.kv .row > span:last-child{font-weight:500;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:10px;padding:5px 10px;font-size:13px;color:var(--fg)}
.chip.blue{background:var(--accent-soft);color:#8CB8FF}
.chip.gold{background:#3A3018;color:var(--gold)}.chip.silver{background:#2A2F3A;color:#C9D1DE}
.cx{position:fixed;inset:0;z-index:140;background:#07090F;display:flex;align-items:center;justify-content:center;animation:cxin .25s ease-out}
.cx.bye{opacity:0;transition:opacity .2s}@keyframes cxin{from{opacity:0}}
.cxst{position:relative;width:100%;height:100%;height:100dvh;max-width:480px;overflow:hidden;color:#fff}
.cxg{position:absolute;inset:0;background:#07090F}
.cxg .room{position:absolute;inset:0;background:radial-gradient(110% 70% at 50% 45%,color-mix(in srgb,var(--tc) 55%,transparent),transparent 75%),linear-gradient(#0B0E18,color-mix(in srgb,var(--tc) 18%,#07090F));opacity:.18}
.cxg.open .room{animation:cxlt 1.3s .25s steps(1) forwards}@keyframes cxlt{0%{opacity:.6}15%{opacity:.18}30%{opacity:.85}45%{opacity:.45}60%,100%{opacity:1}}
.cxg .floor{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(color-mix(in srgb,var(--tc) 14%,#151926),color-mix(in srgb,var(--tc) 10%,#0B0D14));border-top:2px solid color-mix(in srgb,var(--tc) 60%,#000)}
.cxg .bk{position:absolute;inset:0}
.cxg .shut{position:absolute;inset:0;z-index:5;background:repeating-linear-gradient(#3A3F4C 0 14px,#2A2E38 14px 16px,#454B59 16px 18px);box-shadow:0 6px 18px rgba(0,0,0,.6)}
.cxg .shut::after{content:"";position:absolute;left:44%;right:44%;bottom:12px;height:10px;border-radius:4px;background:#1A1D25}
.cxg.open .shut{animation:cxlift 1.1s cubic-bezier(.6,0,.3,1) forwards}@keyframes cxlift{0%{transform:none}8%{transform:translateY(6px)}100%{transform:translateY(-104%)}}
.cxp{position:absolute;left:24px;right:24px;top:50%;z-index:8;background:#F1F3F7;color:#121725;border-radius:10px;padding:22px 20px 20px;border-top:8px solid var(--tc);box-shadow:0 30px 60px rgba(0,0,0,.55);transform:translateY(-50%);animation:cxpin .55s cubic-bezier(.2,.8,.3,1)}
@keyframes cxpin{from{transform:translateY(-30%);opacity:0}}
.cxp.out{transition:transform .5s cubic-bezier(.6,0,.4,1),opacity .5s;transform:translate(130%,-50%) rotate(8deg);opacity:0}
.cxp .hd{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #D5DAE3}
.cxp .hd img{width:40px;height:40px;object-fit:contain}.cxp .hd>b{font-family:var(--num);font-size:24px;min-width:40px;text-align:center}
.cxp .hd b{font-size:17px;display:block}.cxp .hd span{font-size:11px;color:#5A6378}
.cxp dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:14px 0 16px;font-size:13px}.cxp dt{color:#5A6378}.cxp dd{margin:0;font-weight:700;text-align:right}
.cxp .cl{font-size:11px;color:#5A6378;line-height:1.6;margin:0 0 14px}
.cxp .sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.cxp .sb{position:relative;height:66px;border-bottom:1px solid #121725}.cxp .sb svg{position:absolute;inset:0}.cxp .sb small{position:absolute;bottom:-17px;left:0;font-size:10px;color:#5A6378}
.stp{position:absolute;width:92px;height:92px;border-radius:50%;border:4px double var(--stc);color:var(--stc);display:grid;place-content:center;text-align:center;font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.05em;line-height:1.1;opacity:0;animation:cxstamp .45s cubic-bezier(.3,1.4,.5,1) forwards}
.stp img{width:32px;height:32px;object-fit:contain;display:block;margin:0 auto}
.cxp .stp{right:12px;bottom:24px;animation-delay:2.6s}
@keyframes cxstamp{0%{opacity:0;transform:scale(2.4) rotate(-24deg)}70%{opacity:1;transform:scale(.92) rotate(-12deg)}100%{opacity:1;transform:scale(1) rotate(-12deg)}}
.cxhint.end{color:#fff;font-weight:700;font-size:14px;animation:cxbl2 1.2s ease-in-out infinite}@keyframes cxbl2{50%{opacity:.4}}
.cxhint{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:rgba(255,255,255,.5);z-index:9}
@keyframes cxup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cxdrop{0%{opacity:0;transform:translateY(-80px) scale(1.5)}60%{opacity:1;transform:translateY(6px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes cxsl{from{opacity:0;transform:translateX(90px) rotate(8deg)}to{opacity:1;transform:none}}
.cxa{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 30%,var(--tc) 0%,color-mix(in srgb,var(--tc) 40%,#06080F) 60%,color-mix(in srgb,var(--tc) 22%,#06080F) 100%);display:flex;flex-direction:column;align-items:center;padding:calc(76px + env(safe-area-inset-top,0px)) 24px 0;gap:10px;overflow:hidden}
.cxa>*:not(.mq):not(.brk):not(.conf):not(.wf):not(.fl){position:relative;z-index:1}
.cxa{animation:cxshake .34s 3.05s}
@keyframes cxshake{0%,100%{transform:none}20%{transform:translate(5px,-3px)}40%{transform:translate(-5px,3px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,-2px)}}
.cxa .wf{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:cxwf .32s 3.05s;z-index:4}
@keyframes cxwf{0%{opacity:.8}100%{opacity:0}}
.cxa .fl{position:absolute;inset:0;pointer-events:none;z-index:4}
.cxa .fl i{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:radial-gradient(circle,#fff 0,rgba(255,255,255,.85) 12%,rgba(255,255,255,.25) 35%,transparent 62%);opacity:0;animation:cxfl .32s ease-out forwards}
@keyframes cxfl{0%{opacity:0;transform:scale(.3)}25%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
.cxa .mq{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-around;pointer-events:none;transform:rotate(-8deg) scale(1.25);opacity:0;animation:fade .5s .3s forwards}
.cxa .mq div{white-space:nowrap;font-family:var(--num);font-weight:700;font-style:italic;font-size:92px;line-height:.9;text-transform:uppercase}
.cxa .mq .o{color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.22)}.cxa .mq .f{color:rgba(0,0,0,.22)}
.cxa .mq .l{animation:cxmqL 9s linear infinite}.cxa .mq .r{animation:cxmqR 11s linear infinite}
@keyframes cxmqL{to{transform:translateX(-50%)}}@keyframes cxmqR{from{transform:translateX(-50%)}to{transform:none}}
@keyframes fade{to{opacity:1}}
.cxa .brk{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;height:40px;display:flex;background:#0A0C14;box-shadow:0 4px 14px rgba(0,0,0,.45);z-index:2;transform:translateY(-140%);animation:cxbrk .35s .3s cubic-bezier(.2,.8,.3,1) forwards;overflow:hidden}
@keyframes cxbrk{to{transform:none}}
.cxa .brk b{flex:none;display:flex;align-items:center;padding:0 12px 0 14px;background:#E10600;font-family:var(--num);font-weight:700;font-style:italic;font-size:19px;letter-spacing:.04em;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);animation:cxbl 1s .6s 2}
@keyframes cxbl{50%{background:#fff;color:#E10600}}
.cxa .tk{flex:1;min-width:0;overflow:hidden;display:flex;align-items:center}
.cxa .tk span{white-space:nowrap;font-size:13px;font-weight:700;padding-left:100%;animation:cxtk 8s .6s linear infinite}.cxa .tk em{font-style:normal;color:var(--gold);margin:0 10px}
@keyframes cxtk{to{transform:translateX(-100%)}}
.cxa .off{font-family:var(--num);font-weight:700;letter-spacing:.32em;font-size:15px;opacity:0;animation:cxup .4s .4s forwards}
.cxa .lg{width:112px;height:112px;border-radius:28px;background:rgba(255,255,255,.12);display:grid;place-items:center;opacity:0;animation:cxdrop .7s .6s cubic-bezier(.2,.8,.3,1) forwards}
.cxa .lg img{width:78px;height:78px;object-fit:contain}
.cxa .hel{opacity:0;animation:cxsl .55s 1.05s cubic-bezier(.2,.8,.3,1) forwards}
.cxa .nm{font-size:30px;font-weight:700;opacity:0;animation:cxup .4s 1.35s forwards}
.cxa .ln{font-size:15px;opacity:0;animation:cxup .4s 1.5s forwards;text-align:center}
.cxa .tt{font-family:var(--num);font-size:22px;font-weight:600;opacity:0;animation:cxup .4s 1.65s forwards}
.cxa .sg{position:relative;width:220px;height:74px;border-bottom:1px solid rgba(255,255,255,.35)}.cxa .sg svg{position:absolute;inset:0}
.cxa .sg .stp{right:-34px;top:-20px;animation-delay:2.75s}
.cxa .conf i{position:absolute;top:-20px;width:8px;height:12px;animation:cxcf linear forwards;z-index:3}
@keyframes cxcf{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(110vh) rotate(540deg)}}
.cxc{position:absolute;inset:0}
.cxc .num{position:absolute;top:12%;left:0;right:0;text-align:center;font-family:var(--num);font-weight:700;font-size:180px;line-height:1;color:transparent;-webkit-text-stroke:3px color-mix(in srgb,var(--tc) 80%,#fff);opacity:.5}
.cxc .hel{position:absolute;top:34%;left:50%;transform:translateX(-50%)}
.cxc .info{position:absolute;left:0;right:0;bottom:calc(8% + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 20px}
.cxc .lg{height:48px;display:grid;place-items:center;opacity:0;animation:cxup .4s 1s forwards}.cxc .lg img{max-height:48px;max-width:110px;object-fit:contain}.cxc .lg b{font-family:var(--num);font-size:36px}
.cxc .nm{font-size:26px;font-weight:700;opacity:0;animation:cxup .4s 1.15s forwards}
.cxc .ln{font-size:14px;color:rgba(255,255,255,.75);opacity:0;animation:cxup .4s 1.3s forwards}
.cxc .sg{position:relative;width:170px;height:56px}.cxc .sg svg{position:absolute;inset:0}

.cxpad{position:absolute;inset:0;z-index:9;background:rgba(6,8,15,.88);display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px}
.cxpad h3{margin:0;font-size:20px}.cxpad p{margin:0;color:var(--dim);font-size:13px;line-height:1.5}
.cxpad canvas{width:100%;aspect-ratio:3/1;background:#F1F3F7;border-radius:12px;touch-action:none}
.cxpad .row{display:grid;grid-template-columns:1fr 2fr;gap:10px}
@media (prefers-reduced-motion:reduce){.cx *{animation-duration:.01s!important;animation-delay:0s!important}}

.jtro{position:relative;display:inline-block;line-height:0}.jtro svg{display:block}.jtro b{position:absolute;left:0;right:0;top:17%;text-align:center;line-height:1;font-weight:900;color:#6B4A1B;letter-spacing:-.5px}
.tshelf.jr{border-bottom-color:#3A3F4B;padding-top:6px}.tshelf.jr figcaption{font-size:10px}
.crbig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;text-align:center}.crbig b{font-size:22px}.crbig span{font-size:30px;font-weight:900}.chres.win{background:radial-gradient(ellipse at 50% 20%,rgba(242,193,78,.18),transparent 65%),var(--surface)}
.peekbtn{all:unset;box-sizing:border-box;align-self:flex-start;cursor:pointer;font-size:12px;font-weight:700;color:var(--accent);padding:6px 10px;border-radius:999px;background:rgba(49,130,246,.12);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#peek{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);pointer-events:none;padding:16px}
#peek .pk{width:100%;max-width:360px;background:var(--surface);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#peek .pkh{display:flex;justify-content:space-between;align-items:baseline}#peek .pkh b.num{font-size:24px}
#peek .pkr{display:grid;grid-template-columns:72px 1fr 32px;align-items:center;gap:8px;font-size:13px;color:var(--dim)}#peek .pkr .f{color:var(--accent);font-weight:700}#peek .pkr b{color:var(--fg);text-align:right}
.earn{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--dim)}.earn b{color:var(--fg);font-size:15px}.earn em{font-style:normal;color:var(--gold)}.earn i{font-style:normal;margin-left:auto}
.kv.nw .row>span:first-child{white-space:nowrap;margin-right:14px}.kv.nw .row>span:last-child{text-align:right}
.incinfo{font-size:13px;color:var(--dim)}.incinfo summary{cursor:pointer;display:flex;align-items:center;gap:6px;list-style:none}.incinfo summary::-webkit-details-marker{display:none}.incinfo summary svg{width:16px;height:16px;color:#8B93A7}.incinfo p{margin:6px 0 0;line-height:1.5}
.tshelf{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:10px 14px;padding:12px 8px 0;border-bottom:3px solid #3A3F4B;border-radius:4px}
.tshelf figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}.tshelf img{height:64px;width:auto;image-rendering:auto}
.tshelf figcaption{font-size:11px;color:var(--dim);text-align:center;line-height:1.3}
.tshelf.wc{background:radial-gradient(ellipse at 50% 90%,rgba(242,193,78,.22),transparent 70%);border-bottom-color:#8A6A1F}.tshelf.wc img{height:104px;filter:drop-shadow(0 0 10px rgba(242,193,78,.35))}
.tshelf.wc figcaption{color:var(--gold);font-weight:700;font-size:12px}.tcap{margin:0;text-align:center;color:var(--gold);font-weight:800;font-size:14px}
.chip.red{background:#3D1B21;color:#FF8A95}
.helmet{flex:none;position:relative;display:grid;place-items:center;border-radius:16px;background:var(--surface-2)}
.himg{width:92%;height:auto;image-rendering:pixelated;display:block}
.hnum{position:absolute;left:31%;top:57%;transform:translate(-50%,-50%);font-family:"Barlow Condensed",sans-serif;font-weight:700;color:#fff;-webkit-text-stroke:.06em #000;paint-order:stroke;line-height:1;pointer-events:none}
.helmet svg{display:block;width:86%;height:auto;shape-rendering:crispEdges;image-rendering:pixelated}
.hed{display:flex;flex-direction:column;gap:14px}
.htabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;background:var(--surface-2);border-radius:12px}
.htabs button{border:0;background:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 0;border-radius:9px}
.htabs button[aria-selected="true"]{background:var(--surface);color:var(--fg)}
.hed .swatches{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:4px 2px 6px;margin-top:6px;scrollbar-width:none}
.hed .swatches::-webkit-scrollbar{display:none}
.hed .sw{width:34px;height:34px;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hopt{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent;background:var(--surface-2);border-radius:12px;padding:6px 2px 6px;color:var(--fg);font-size:12px}
.hopt .himg{width:100%;max-width:70px}
.hopt[aria-pressed="true"]{border-color:var(--accent)}
.obhero{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:4px 16px;border-radius:20px;background:radial-gradient(120% 90% at 30% 20%,#2a3550 0%,#171a22 70%);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.obhero .helmet{background:none}
.obhel{justify-content:center;padding:0 16px}
.avfull{display:block;width:auto;max-width:none;flex:none;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.avface{flex:none;position:relative;overflow:hidden;border-radius:16px;background:var(--surface-2)}
.avface img{position:absolute;left:50%;top:5%;width:84%;transform:translateX(-50%);image-rendering:pixelated}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.avopt{border:2px solid transparent;background:none;border-radius:18px;padding:0;display:grid;place-items:center}
.avopt .avface{width:100%!important;height:auto!important;aspect-ratio:1}
.avopt[aria-pressed="true"]{border-color:var(--accent)}
.obstage{flex:none}
.obtag{display:flex;flex-direction:column;gap:2px;min-width:0}
.obtag b{font-size:34px;line-height:1;color:#fff}
.obtag span{font-size:18px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obtag em{font-style:normal;font-size:13px;color:#9AA3B2}
.ovr{font-family:var(--num);font-weight:700;font-size:44px;line-height:1;color:var(--fg)}
.ovr small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;text-align:right}
.bar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px}
.statrow{display:grid;grid-template-columns:120px 1fr 34px;white-space:nowrap;align-items:center;gap:12px}
.statrow b{text-align:right;font-family:var(--num);font-size:19px}
.delta{color:var(--bad)!important;font-weight:700}
.delta.down{color:var(--accent)!important}
.field{background:var(--surface-2);border:0;border-radius:14px;padding:14px 16px;color:var(--fg);font:inherit;font-size:16px;width:100%;min-width:0}
.field::placeholder{color:var(--dim)}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 96px;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg)}
.steps{display:flex;gap:6px;justify-content:center}
.steps i{width:22px;height:6px;border-radius:6px;background:var(--line)}
.steps i.on{background:var(--accent)}
.choice{background:var(--surface);border:2px solid transparent;border-radius:22px;padding:18px 20px;text-align:left;display:flex;flex-direction:column;gap:10px;width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent)}
.choice .row .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px}

function styleStats(base,styleId){
  const bias=B.styles.find(s=>s.id===styleId).bias;
  const st={};STATS.forEach(k=>st[k]=base+(bias[k]||0)+ri(-2,2));
  let diff=base*6-STATS.reduce((a,k)=>a+st[k],0),i=0;
  while(diff!==0){const k=STATS[i%6],s=diff>0?1:-1;st[k]+=s;diff-=s;i++}
  STATS.forEach(k=>st[k]=clamp(st[k],1,99));return st;
}

  const ovr=ri(74,84),style=pick(B.styles).id;
  const nn=pick(NATS);return {id:'r'+Date.now()+ri(0,9999),name:genName(nn),nationality:nn,birth_year:0,age:ri(19,22),team,style,potential:clamp(ovr+ri(4,14),ovr,96),stats:styleStats(ovr,style),rookie:true};
}

function updateMachines(ev){
  const MR=B.machine.major_regulation,major=S.year===nextMajorYear();

  if(major){
    ev.push(`${S.year} 대규정 변경! 새 규정으로 머신 판도가 흔들렸어요.`);
    S.teams.forEach(t=>{t.machine=Math.random()<MR.tier_reshuffle_chance?rnd(72,92):t.machine+rnd(-MR.swing,MR.swing)});
  }else{const m=B.machine.minor_change_per_year;S.teams.forEach(t=>t.machine+=rnd(-m,m))}

  const ts=[...S.teams].sort((a,b)=>b.machine-a.machine);let i=0;

      if(Math.random()<B.race.dnf.mechanical+crash){e.dnf++;e.fp[r]=99;continue}
      e.pv=dw*((isWet?e.w:e.d)-(e.adapt?e.adapt(r):0))+cw*e.car+gauss()*sd;fin.push(e)}

function grow(p,played,poor){
  const band=B.driver.growth_by_age.find(b=>p.age>=b.from&&p.age<=b.to)||B.driver.growth_by_age.at(-1);

  const tr=S.train?TRAIN.find(x=>x.id===S.train):null;
  const AD=B.driver.age_decline_by_stat||{};
  const GS=B.driver.growth_spread||[.6,1.4];
  STATS.forEach(k=>{let g=base*rnd(GS[0],GS[1]);if(g<0)g*=AD[k]??1;
    if(g>0){g*=mult;if(p.focus.includes(k))g*=B.driver.focus_multiplier;if(tr)g*=tr.mult[k]||tr.mult.all||1;

}

function ageF1Grid(){

    d.age++;let delta=0;
    if(d.age<24)delta=ri(1,3);else if(d.age<=28)delta=ri(0,1);else if(d.age<=32)delta=0;else if(d.age<=35)delta=-ri(1,3);else delta=-ri(2,4);

    const AD=B.driver.age_decline_by_stat||{};STATS.forEach(k=>d.stats[k]=clamp(d.stats[k]+(delta<0?Math.round(delta*(AD[k]??1)):delta)+ri(-1,1),1,99));

    if(h2h&&h<.25&&ovr<mateOvr-4&&safe){evs.push(`${tm.name}이(가) 경고를 보냈어요. 팀메이트에게 크게 밀린 건 문제래요. 내년에도 이러면 위험해요.`)}

    cands.sort((a,b)=>b.score-a.score).filter(c=>!bound||c.t.machine>teamDef(p.team.id).machine).slice(0,bound?1:3).forEach(c=>{const tr=terms(c.t);o.push({kind:'f1',teamId:c.t.id,...tr,title:`${c.t.name} 레이스 시트`,

    let ids=ac?ac.teams.filter(id=>id!==p.team?.id):[];
    if(!ids.length){const hot=S.teams.filter(t=>scv(t.id)>=80).sort((a,b)=>scv(b.id)-scv(a.id)).map(t=>t.id);ids=hot.length?hot:Math.random()<.6?[pick(S.teams.filter(t=>t.tier!=='bottom')).id]:[]}

  const needAlt=(champF2&&!o.some(x=>x.kind==='f1'))||p.age>=21&&(p.series==='F2'||p.series==='ALT'||(p.series==='F1'&&(p.role==='reserve'||!contracted())))&&!bound;
  if(needAlt){
    const alts=p.series==='ALT'?[altDef(p.alt),...K.alt_series.filter(a=>a.id!==p.alt).sort(()=>Math.random()-.5).slice(0,1)]:[...K.alt_series].sort(()=>Math.random()-.5).slice(0,2);
    const tier=ovr>=82?'top':ovr>=76?'mid':'bottom';

function applyOffer(o){
  const p=S.p,ev=[];
  const leavingF1Seat=p.series==='F1'&&p.role==='race'&&!(o.kind==='resign');
  const oldTeam=p.series==='F1'?p.team.id:null;
  if(o.kind==='retire'){p.retired=true;if(leavingF1Seat)fillSeat(oldTeam);S.phase='retired';save();return}
  if(o.kind==='junior'){
    if(o.academy){p.academy=o.academy;p.academyBad=0}
    p.seriesSeasons=p.series===o.series?p.seriesSeasons+1:1;if(o.series==='F2')p.f2Seasons++;
    p.series=o.series;p.team=o.team;p.role='race';
  }else if(o.kind==='resign'){p.seriesSeasons++;p.contract={left:o.years,option:o.option,clause:o.clause,sal:o.sal}}
  else if(o.kind==='stay'){p.seriesSeasons++}
  else if(o.kind==='option'){p.seriesSeasons++;p.contract={left:1,option:false,clause:!!(p.contract&&p.contract.clause),sal:o.sal}}
  else if(o.kind==='f1'){reactTransfer(o);
    if(o.poach){const d=S.f1.find(x=>x.id===o.poach);if(d){const tn=teamDef(o.teamId).name;
      if(leavingF1Seat&&oldTeam){d.team=oldTeam}else S.f1=S.f1.filter(x=>x!==d);
      if(S.news&&S.news.heads)S.news.heads.unshift({t:`${p.name}, ${tn} 이적 확정! ${d.name}${leavingF1Seat?'와(과) 자리 맞교환':'은(는) 시트를 잃어'}`,c:'gold'})}}
    p.series='F1';p.role='race';p.team={id:o.teamId};p.seriesSeasons=1;if(!p.debutYear)p.debutYear=S.year;p.academy=null;p.contract={left:o.years,option:o.option,clause:o.clause,sal:o.sal};
    if(leavingF1Seat)fillSeat(oldTeam);
  }else if(o.kind==='reserve'){p.contract=null;p.series='F1';p.role='reserve';p.team={id:o.teamId};if(leavingF1Seat)fillSeat(oldTeam)}
  else if(o.kind==='alt'){p.contract=null;p.seriesSeasons=p.series==='ALT'&&p.alt===o.altId?p.seriesSeasons+1:1;p.series='ALT';p.alt=o.altId;p.team={name:o.altTeam||altDef(o.altId).name,tier:o.tier,f1:o.altF1||null};p.role='race';if(leavingF1Seat)fillSeat(oldTeam)}
  fillVacancies();
  {const tgt=p.age>=36?70:p.age>=33?78:85;p.morale=Math.round(p.morale+(tgt-p.morale)*.45)}
  if(S.train==='rest')p.morale=Math.min(100,p.morale+15);
  p.val=valueOf();p.valPeak=Math.max(p.valPeak||0,p.val);
  S.offers=[];S.phase='ready';S.events=genEvents();buildNotice();
  S.challenge=(p.series==='F1'&&p.role==='race'&&Math.random()<.2+p.fans/250)?(Math.random()<.7||p.age<24?{id:'LEMANS',name:'르망 24시'}:{id:'INDY500',name:'인디 500'}):null;
  save();
}

function applyIncident(inc,j){
  const p=S.p,def=INC.find(x=>x.id===inc.id),c=def.choices[j],o=S.season.orders[inc.r];
  let delta=0,dnf=false,eff=null,ok=true;
  if(c.fixed){delta=c.fixed.delta;eff=c.fixed.eff}
  else{eff=c.eff||null;
    ok=Math.random()<incChance(c);
    if(!ok&&c.dnf&&Math.random()<c.dnf*2)dnf=true;else delta=ri(...(ok?c.good:c.bad))}
  const i=o.fin.indexOf('me');let txt;

function gachaP(g){return clamp(g.p+(S.p.morale-60)/300,.25,.9)}
function resolveGacha(go){
  const Z=S.season,G=Z.gacha,g=GACHA.find(x=>x.id===G.id);G.done=true;
  G.go=go;G.res=go?null:'rest';
  if(!go){applyEff({morale:6});save();return{ok:null,t:'쉬면서 체력을 챙겼어요 · 체력 +6'}}
  applyEff({morale:-6});
  if(Math.random()<gachaP(g)){G.res='win';const m=applyEff(g.win);save();return{ok:true,t:`성공! ${m} · 체력 -6`}}
  G.res=g.slump?'slump':'inj';
  if(g.slump){const o=Z.orders[G.r],i=o.fin.indexOf('me');if(i>=0){const ni=Math.min(o.fin.length-1,i+g.slump);o.fin.splice(i,1);o.fin.splice(ni,0,'me')}

  const k=ri(...g.inj);let miss=0;
  for(let r=G.r;r<Math.min(Z.races,G.r+k);r++){const o=Z.orders[r];o.fin=o.fin.filter(x=>x!=='me');o.dnf=o.dnf.filter(x=>x!=='me');o.q=o.q.filter(x=>x!=='me');if(!Z.meAbsent.includes(r)){Z.meAbsent.push(r);miss++}}

function genEvents(){
  const p=S.p,stage=p.series==='F1'?'f1':ORDER.includes(p.series)?'junior':'all';
  const n=Math.random()<.6?1:2;
  const recent=new Set(S.recentEv||[]);
  const pool=EVENTS.filter(e=>(e.stage==='all'||e.stage===stage)&&!recent.has(e.id)&&evOK(e,p));
  const W={'팬':3,'팀':2.5,'특별훈련':2,'컨디션':1.5,'가정사':1.2},out=[];
  while(out.length<n){const c=pool.filter(e=>!out.includes(e));if(!c.length)break;
    let r=Math.random()*c.reduce((a,e)=>a+(W[e.cat]||1),0);const pickE=c.find(e=>(r-=W[e.cat]||1)<0)||c[0];
    if(out.some(o=>o.cat===pickE.cat)&&c.some(e=>!out.some(o=>o.cat===e.cat)))continue;out.push(pickE)}

}

function applyEff(eff){
  const p=S.p,parts=[];
  if(eff.stats)for(const k in eff.stats){p.stats[k]=clamp(p.stats[k]+eff.stats[k],1,99);parts.push(`${LBL[k]} ${eff.stats[k]>0?'+':''}${eff.stats[k]}`)}
  if(eff.fans){p.fans=clamp(p.fans+eff.fans,0,100);parts.push(`인기 ${eff.fans>0?'+':''}${eff.fans}`)}
  if(eff.morale){p.morale=clamp(p.morale+eff.morale,0,100);parts.push(`체력 ${eff.morale>0?'+':''}${eff.morale}`)}
  if(eff.rep){p.repBonus=(p.repBonus||0)+eff.rep;p.rep=clamp(p.rep+eff.rep,0,100);parts.push(`평판 ${eff.rep>0?'+':''}${eff.rep}`)}
  p.peak=Math.max(p.peak,ovrOf(p.stats));return parts.join(' · ');
}
function runChallenge(){

  p.challenges.push({id:c.id,name:c.name,year:S.year,res});
  if(res==='우승'&&PRIZE[c.id]){p.earn=(p.earn||0)+PRIZE[c.id];p.prizeY=(p.prizeY||0)+PRIZE[c.id]}

  S.challenge=null;save();
  return`${c.name} ${res}!${res==='우승'&&tripleCrown()?' 트리플 크라운 달성!':''}`;
}

const T_BAD=['내려갔','고전','떨어졌','시트를 잃','은퇴'];
function tone(s,o={}){
  const p=S.p,my=o.team!==undefined?o.team:(p.series==='F1'?teamDef(p.team.id).name:null);
  if(ME_BAD.some(w=>s.includes(w)))return'tb';
  if(ME_GOOD.some(w=>s.includes(w))||s.includes(p.name)&&T_GOOD.some(w=>s.includes(w)))return'tg';
  if(o.mine||(my&&s.includes(my))){if(T_BAD.some(w=>s.includes(w)))return'tb';if(T_GOOD.some(w=>s.includes(w)))return'tg'}
  // other teams: color from that team's point of view so offers can be compared
  if(o.any!==false&&S.teams.some(t=>s.includes(t.name))){if(T_BAD.filter(w=>w!=='은퇴').some(w=>s.includes(w)))return'tb';if(T_GOOD.some(w=>s.includes(w)))return'tg'}
  return'';
}

function cardData(){
  const p=S.p,h=p.history,teams=Object.entries(p.f1Teams).sort((a,b)=>b[1]-a[1]).map(([id,n])=>({...teamDef(id),n}));
  const best=h.reduce((a,x)=>{const lv=x.sid==='F1'?6:x.sid==='ALT'?5:ORDER.indexOf(x.sid)+1;return lv>a.lv?{lv,name:x.series}:a},{lv:0,name:'카트'});
  return{p,teams,first:h[0]?.year??S.year,last:h.at(-1)?.year??S.year,seasons:h.length,best:best.name}
}
function cardTrophies(p,F){
  const TI=[],imOK=k=>TROPHY_IMG[k]&&TROPHY_IMG[k].complete&&TROPHY_IMG[k].naturalWidth;
  p.history.filter(h=>h.sid==='F1'&&h.titled).forEach(h=>TI.push({k:'F1',h:290,y:h.year}));
  if(tripleCrown())TI.push({pill:'트리플 크라운'});
  p.alts.forEach(a=>{const d=K.alt_series.find(x=>x.name===a.name);if(d&&TROPHY[d.id])TI.push({k:d.id,h:215,y:a.year})});
  p.challenges.filter(c=>c.res==='우승').forEach(c=>TI.push({pill:`${c.name} 우승`}));
  if(p.monaco)TI.push({pill:'모나코 우승'});
  p.jr.filter(j=>JR_LBL[j.series]).forEach(j=>TI.push({jr:j.series,h:125,y:j.year}));
  const mg=document.createElement('canvas').getContext('2d');let s=1,tot=0,rowH=0;
  if(TI.length){if(mg)mg.font=`700 34px ${F}`;
    TI.forEach(x=>{x.w=x.pill?(mg?mg.measureText(x.pill).width:x.pill.length*30)+52:x.jr?x.h:(imOK(x.k)?x.h*TROPHY_IMG[x.k].naturalWidth/TROPHY_IMG[x.k].naturalHeight:x.h*.5)});
    // one row if it fits; otherwise major trophies on top, junior ones below (each row shrinks only if it must)
    const wOf=R=>R.reduce((a,x)=>a+x.w,0)+14*(R.length-1),maj=TI.filter(x=>!x.jr),jr=TI.filter(x=>x.jr);
    const rows=wOf(TI)<=990||!maj.length||!jr.length?[TI]:[maj,jr];
    let y=1100;rows.forEach(R=>{const sc=Math.min(1,990/wOf(R)),rh=Math.max(...R.map(x=>x.pill?62:x.h))*sc,rw=wOf(R)*sc;y+=40+rh;let tx=(1080-rw)/2;R.forEach(x=>{x.s=sc;x.tx=tx;x.base=y;tx+=(x.w+14)*sc});y+=30});
    rowH=y-1100-30}
  return{TI,s,tot,rowH,imOK}}
function drawCard(){

  const grd=g.createLinearGradient(0,0,W,H);grd.addColorStop(0,'#1A2440');grd.addColorStop(1,'#0B0F1C');g.fillStyle=grd;rr(g,0,0,W,H,56);g.fill();
  g.save();rr(g,0,0,W,H,56);g.clip();g.strokeStyle='rgba(255,255,255,.035)';g.lineWidth=26;for(let x=-H;x<W;x+=70){g.beginPath();g.moveTo(x,H);g.lineTo(x+H,0);g.stroke()}
  g.fillStyle='#F2C14E';g.fillRect(0,0,W,14);g.restore();

  const big=[[p.tot.titles,'월드 챔피언','#F2C14E'],[p.tot.wins,'우승','#fff'],[p.tot.podiums,'포디움','#fff']];

  small.forEach((b,i)=>{const x=W/6+i*W/3;g.fillStyle='#fff';g.font=`700 64px ${N}`;g.fillText(String(b[0]),x,1020);g.fillStyle='#AEB4C2';g.font=`500 28px ${F}`;g.fillText(b[1],x,1060)});
  g.beginPath();g.moveTo(80,1100);g.lineTo(W-80,1100);g.stroke();
  // trophy cabinet, in order of prestige
  if(TI.length){
    TI.forEach(x=>{const s=x.s,w=x.w*s,tx=x.tx,base=x.base;
      if(x.pill){g.font=`700 ${Math.round(34*s)}px ${F}`;g.strokeStyle='#8A6A1F';g.fillStyle='#2A2414';rr(g,tx,base-62*s,w,58*s,29*s);g.fill();g.stroke();g.fillStyle='#F2C14E';g.textAlign='center';g.fillText(x.pill,tx+w/2,base-21*s)}
      else{const h=x.h*s;
        if(x.k==='F1'){const gl=g.createRadialGradient(tx+w/2,base-h*.3,4,tx+w/2,base-h*.3,h*.8);gl.addColorStop(0,'rgba(242,193,78,.35)');gl.addColorStop(1,'rgba(242,193,78,0)');g.fillStyle=gl;g.beginPath();g.arc(tx+w/2,base-h*.3,h*.8,0,Math.PI*2);g.fill()}
        if(x.jr){const rows=TROPHY_MAP.trim().split('\n').map(r=>r.trim()),cs=h/rows.length;rows.forEach((r,yy)=>[...r].forEach((ch,xx)=>{if(TROPHY_PAL[ch]){g.fillStyle=TROPHY_PAL[ch];g.fillRect(tx+xx*cs,base-h+yy*cs,cs+.6,cs+.6)}}));

const CER_N=5;
function showCeremony(){
  let el=document.getElementById('cer');if(!el){el=document.createElement('div');el.id='cer';el.className='cer';document.body.appendChild(el)}
  el.innerHTML=`<div class="cbar">${Array.from({length:CER_N},(_,j)=>`<i class="${j<cerI?'done':j===cerI?'on':''}"></i>`).join('')}</div>${cerPage(cerI)}${cerI<CER_N-1?'<div class="chint">탭해서 넘기기 ›</div>':''}<button class="cskip" type="button" id="cerSkip">건너뛰기</button>`;
  el.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n,t0=performance.now(),dur=900+Math.min(n,200)*4;
    const f=now=>{const k=Math.min(1,(now-t0)/dur);b.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
  clearTimeout(cerT);
  el.onclick=e=>{if(e.target.closest('#cerEnd')||e.target.closest('#cerSkip')){endCeremony();return}
    if(cerI<CER_N-1){cerI++;showCeremony()}};
}
function endCeremony(){clearTimeout(cerT);const el=document.getElementById('cer');if(el)el.remove();S.p.cerDone=true;save();render();window.scrollTo(0,0)}
function startCeremony(){cerI=0;showCeremony()}

/* ---------- season progress ---------- */
const F1CAL=['호주','중국','일본','바레인','사우디아라비아','마이애미','캐나다','모나코','바르셀로나','오스트리아','영국','벨기에','헝가리','네덜란드','이탈리아','마드리드','아제르바이잔','싱가포르','미국','멕시코','브라질','라스베이거스','카타르','아부다비'];
let progTimer=null,progI=0,feed=[];
function roundName(r){return S.season.ctx.f1?`R${r+1} · ${F1CAL[r%F1CAL.length]} GP`:`${r+1}라운드`}
function progressView(){
  const C=S.season.ctx;
  return`<section class="prog">${stepper()}<div class="eyebrow">${C.year} ${sLogo(C.sid)}시즌 · ${withLogos(esc(C.teamName))}${C.role==='reserve'?' 리저브':''}</div>
    <h2 class="h2" id="pHead">${C.role==='reserve'?'패독에서 기회를 기다리고 있어요':'시즌 개막을 앞두고 있어요'}</h2>
    <div class="progbar"><i id="pBar"></i></div><div class="muted num" id="pRound" style="font-size:15px">0 / ${S.season.races} 라운드</div>
    <div class="progrank"><b id="pRank">–</b><span class="muted" id="pPts">${esc(C.seriesName)}</span></div>
    <div class="feed" id="pFeed"></div>
    <button class="btn ghost" type="button" id="skipProg">건너뛰기</button><div id="pInc"></div></section>`;
}
function roundInfo(r){
  const Z=S.season,m=tally(r),me=m.me,o=Z.orders[r],ab=Z.meAbsent.includes(r);
  const rank=me.starts>0?standingsOf(Object.values(m)).findIndex(e=>e.key==='me')+1:null;
  return{r,wet:o.wet,absent:ab,fp:ab?null:me.fp[r]??null,pole:o.q[0]==='me',pts:me.pts,rank,wins:me.wins};
}
function describe(t){
  const C=S.season.ctx;
  if(t.absent||t.fp==null)return{head:C.role==='reserve'?'패독에서 기회를 기다리고 있어요':'부상에서 회복하고 있어요'};
  if(t.fp===1)return{head:t.wins===1?'첫 우승을 차지했어요!':'우승했어요!',note:{t:`${roundName(t.r)} 우승${t.wet?' (빗속 레이스)':''}`,c:'gold'},hl:1};
  if(t.fp===99)return{head:'리타이어했어요',note:{t:`${roundName(t.r)} 리타이어`,c:'bad'},hl:1};
  if(t.fp<=3)return{head:'포디움에 올랐어요',note:{t:`${roundName(t.r)} ${t.fp}위 포디움`,c:'blue'},hl:1};
  if(t.pole)return{head:'폴 포지션을 잡았어요',note:{t:`${roundName(t.r)} 폴 포지션`,c:'blue'}};
  if(t.wet)return{head:'빗속에서 달리고 있어요'};
  if(t.rank<=3)return{head:'선두권을 지키고 있어요'};
  if(t.rank<=10)return{head:'포인트권에서 싸우고 있어요'};
  return{head:'한 계단씩 올라가고 있어요'};
}
function startProgress(){
  clearTimeout(progTimer);progI=0;feed=[];
  S.season.ctx.ev.filter(x=>x.includes('콜업')||x.includes('부상')).forEach(e=>feed.unshift({t:e,c:'blue'}));paintFeed();
  progTimer=setTimeout(stepProgress,500);
}
function paintFeed(){const f=document.getElementById('pFeed');if(f)f.innerHTML=feed.map(x=>`<div class="${x.c}">${esc(x.t)}</div>`).join('')}
function stepProgress(){
  if(!S||S.phase!=='progress'||!S.season)return;const Z=S.season;
  if(progI>=Z.races){progTimer=setTimeout(finishProgress,700);return}
  if(Z.gacha&&!Z.gacha.done&&Z.gacha.r===progI){showGacha();return}
  const inc=Z.incidents.find(x=>x.r===progI&&!x.done);
  if(inc){showIncident(inc);return}
  if(progI===Z.races-1&&!Z.decDone){Z.decDone=true;const D=deciderInfo();if(D){showDecider(D,()=>{progTimer=setTimeout(stepProgress,200)});return}}
  const t=roundInfo(progI),d=describe(t);
  if(d.note){feed.unshift(d.note);paintFeed()}
  const g=id=>document.getElementById(id);if(!g('pHead'))return;
  g('pHead').textContent=d.head;
  g('pBar').style.width=((progI+1)/Z.races*100)+'%';
  g('pRound').textContent=`${progI+1} / ${Z.races} 라운드 · ${roundName(t.r)}`;
  if(t.rank){g('pRank').textContent=t.rank+'위';g('pPts').textContent=`/ ${Z.ents.length}명 · ${t.pts}점`}
  progI++;
  progTimer=setTimeout(stepProgress,clamp(4500/Z.races,180,550)+(d.hl?450:0));
}
function showIncident(inc){
  const d=INC.find(x=>x.id===inc.id),box=document.getElementById('pInc');if(!box)return;
  document.getElementById('pBar').style.width=((inc.r+1)/S.season.races*100)+'%';
  document.getElementById('pRound').textContent=`${inc.r+1} / ${S.season.races} 라운드 · ${roundName(inc.r)}`;
  box.innerHTML=`<div class="sheet"><section class="card"><div class="eyebrow">${roundName(inc.r)} · 레이스 중 상황</div><h3 class="h2">${esc(d.title)}</h3><p class="muted" style="margin:0">${esc(d.desc)}</p>
    <details class="incinfo"><summary>${ISVG} 관련 능력이 확률에 영향을 줘요</summary><p>관련 능력이 이 리그 평균(${incMean()})보다 높을수록 성공 확률이 올라가요. 평균과 같으면 50%, 10 높으면 약 75%예요. 위험한 선택은 확률이 조금 더 낮고, 어떤 경우든 15~85% 사이예요.</p></details>
    ${d.choices.map((c,j)=>`<button class="choice" type="button" data-inc="${j}" style="background:var(--surface-2)"><span class="h3">${esc(c.label)}</span><span class="muted" style="font-size:14px">${esc(c.desc)}</span><span class="chips">${c.fixed?`<span class="chip ${c.fixed.delta>0?'down':''}" style="font-size:13px">순위 ${c.fixed.delta>0?'-'+c.fixed.delta:'유지'}</span>`+effChips(c.fixed.eff).replace(/^<span class="chips">|<\/span>$/g,''):`<span class="chip" style="font-size:13px">관련 능력: ${c.stat?LBL[c.stat]+' '+S.p.stats[c.stat]:'운'}</span><span class="chip blue" style="font-size:13px">성공 확률 ${Math.round(incChance(c)*100)}%</span><span class="chip up" style="font-size:13px">성공 시 최대 ${-c.good[0]>0?-c.good[0]+'계단 상승':'순위 유지'}</span><span class="chip down" style="font-size:13px">실패 시 최대 ${c.bad[1]}계단 하락${c.dnf?' · 리타이어 위험':''}</span>`}</span></button>`).join('')}</section></div>`;
}
function finishProgress(){
  clearTimeout(progTimer);if(!S||S.phase!=='progress')return;
  const G=S.season.gacha,pend=S.season.incidents.find(x=>!x.done),dec=!S.season.decDone&&deciderInfo()?S.season.races-1:null,pr=[G&&!G.done?G.r:null,pend?pend.r:null,dec].filter(x=>x!=null);
  if(pr.length){progI=Math.min(...pr);stepProgress();return}
  finishSeason();tab='home';resMore=false;hlMore=false;render();window.scrollTo(0,0);
  const R=S.last&&S.last.rec;if(R&&R.titled)celebrate(R);
}
function stepper(){
  const ph=S.phase,steps=[['ready','프리시즌'],['progress','시즌'],['result','시즌 결과'],['offers','이적 시장']];
  return`<div class="stepper">${steps.map(([k,l])=>`<span class="${k===ph?'on':''}">${l}</span>`).join('<i>›</i>')}</div>`;
}

function lightsGo(cb){
  const el=document.createElement('div');el.className='lights';
  el.innerHTML=`<div class="gantry">${'<div class="pod"><i></i><i></i></div>'.repeat(5)}</div><div class="go">LIGHTS OUT!</div><div class="skip">탭해서 건너뛰기</div>`;
  document.body.appendChild(el);let done=false;
  const fin=()=>{if(done)return;done=true;lightsT.forEach(clearTimeout);lightsT=[];el.remove();cb()};
  el.addEventListener('click',fin);
  const pods=el.querySelectorAll('.pod');
  for(let i=0;i<5;i++)lightsT.push(setTimeout(()=>pods[i]&&pods[i].classList.add('on'),350+i*520));
  const off=350+4*520+600+Math.random()*700;
  lightsT.push(setTimeout(()=>{pods.forEach(p=>p.classList.remove('on'));el.classList.add('out')},off));
  lightsT.push(setTimeout(fin,off+750));
}

function sigSVG(st,w,h,color){const pd=4,ds=st.map(s=>s.map(([x,y],i)=>`${i?'L':'M'}${(pd+x*(w-2*pd)).toFixed(1)} ${(pd+y*(h-2*pd)).toFixed(1)}`).join(' '));
  return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%">${ds.map(d=>`<path d="${d}" fill="none" stroke="${color}" stroke-width="${Math.max(1.6,h/26)}" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`}
function drawSig(svg,delay,dur){if(!svg)return;const ps=[...svg.querySelectorAll('path')],L=ps.map(q=>q.getTotalLength?q.getTotalLength():100),tot=L.reduce((a,b)=>a+b,0)||1;let t=delay;
  ps.forEach((q,i)=>{q.style.strokeDasharray=L[i];q.style.strokeDashoffset=L[i];const d=dur*L[i]/tot;if(q.animate)q.animate([{strokeDashoffset:L[i]},{strokeDashoffset:0}],{duration:d,delay:t,fill:'forwards',easing:'ease-in-out'});else q.style.strokeDashoffset=0;t+=d})}
function teamSig(id){let s=[...String(id)].reduce((a,c)=>a*31+c.charCodeAt(0),7)>>>0;const r=()=>(s=(s*1103515245+12345)>>>0)/4294967296,a=[];let x=.08;
  for(let i=0;i<7;i++){const w=.07+r()*.06;for(let k=0;k<=8;k++){const t=k/8;a.push([x+w*t,.55-.35*Math.sin(t*Math.PI)*(.6+r()*.5)+(r()-.5)*.05])}x+=w*.9}return[a,[[.1,.8],[.5,.72],[.9,.78]]]}
function sigPad(el,done){
  el.innerHTML=`<div class="cxpad"><h3>계약서에 사인해 주세요</h3><p>처음 한 번만 해요. 다음 계약부터는 이 사인이 자동으로 들어가요.</p><canvas width="900" height="300"></canvas><div class="row"><button class="btn ghost" type="button" data-x="clr">지우기</button><button class="btn" type="button" data-x="ok" disabled>사인 완료</button></div></div>`;
  const c=el.querySelector('canvas'),g=c.getContext('2d'),strokes=[];let cur=null;g.lineWidth=7;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#121725';
  const pt=e=>{const r=c.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width,0,1),clamp((e.clientY-r.top)/r.height,0,1)]},ok=el.querySelector('[data-x=ok]');
  c.addEventListener('pointerdown',e=>{e.preventDefault();c.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur)});
  c.addEventListener('pointermove',e=>{if(!cur)return;const q=cur.at(-1),n=pt(e);cur.push(n);g.beginPath();g.moveTo(q[0]*900,q[1]*300);g.lineTo(n[0]*900,n[1]*300);g.stroke()});
  const end=()=>{if(cur&&cur.length<2)strokes.pop();cur=null;ok.disabled=!strokes.length};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
  el.querySelector('[data-x=clr]').onclick=e=>{e.stopPropagation();strokes.length=0;g.clearRect(0,0,900,300);ok.disabled=true};
  ok.onclick=e=>{e.stopPropagation();done(strokes.map(s=>s.filter((q,i)=>i%2===0||i===s.length-1).map(([x,y])=>[+x.toFixed(3),+y.toFixed(3)])))}}

function showDecider(D,done){

    const pm=i===N?D.fm:Math.max(1,Math.round(D.qm+(((D.fm||D.qm+4))-D.qm)*k)+noise),pr=i===N?D.fr:Math.max(1,Math.round(D.qr+(((D.fr||D.qr+4))-D.qr)*k)-noise);seq.push([pm,pr])}

    if(!ok){const a=D.me.pts+pts(D.fm),b=D.riv.pts+pts(D.fr);el.querySelector('.dstat').textContent=`단 ${b-a}점 차로 타이틀을 놓쳤어요`}
    setTimeout(()=>{el.remove();done()},ok?900:1800)};
  const step=()=>{paint();if(i>=N){end();return}i++;T=setTimeout(step,i===N?1300:750)};

    if(dnf&&(k==='consistency'||k==='mental'))w+=.12;if(qBad&&k==='quali')w+=.1;
    return{k,v:w*Math.max(0,97-st[k])}}).sort((a,b)=>b.v-a.v);
  const why=k=>k==='race'?'결선에서 가장 중요한데 아직 낮아요':k==='tyre'?'레이스 후반 페이스를 지켜 줘요':k==='quali'?(qBad?'예선에서 팀메이트에게 밀렸어요':'출발 위치가 좋아져요'):

  return sc.slice(0,2).map(x=>({k:x.k,why:why(x.k)}))}

function bigToast(title,msg,risk){const old=document.getElementById('btoast');if(old)old.remove();
  const parts=String(msg||'').split(' · ').filter(Boolean),d=document.createElement('div');d.id='btoast';
  d.innerHTML=`<div class="bt">${risk?`<div class="btr">${esc(risk)}</div>`:''}<b>${esc(title)}</b><div class="btc">${parts.map(s=>{const m=s.match(/^(.*?)\s([+-]\d+)$/);return m?`<span class="${m[2][0]==='+'?'pos':'neg'}"><i>${esc(m[1])}</i>${m[2]}</span>`:`<span>${esc(s)}</span>`}).join('')}</div></div>`;
  document.body.appendChild(d);const close=()=>{d.classList.add('bye');setTimeout(()=>d.remove(),200)};setTimeout(close,2200)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
